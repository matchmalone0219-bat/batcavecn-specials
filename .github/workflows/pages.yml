name: Publish special archives

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate archives and interactions
        run: |
          python3 verify.py
          python3 verify-build.py
          node verify-intro.js
          node verify-arkham-nav.js
          node verify-arkham-menu.js
          node verify-investigation.js
          node verify-tas-motion.js
          node --check app.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare project-path links and assets
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 prepare_pages.py --base-path "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
